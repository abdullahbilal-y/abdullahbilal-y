<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-labelledby="t d">
  <title id="t">Abdullah Bilal, AI engineer in Islamabad</title>
  <desc id="d">Three pipelines: call to LLM to warm transfer, screen to VLM to click, photo to OCR to invoice.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
    .pill { fill: none; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #6e7681; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .label { fill: #e6edf3; text-anchor: middle; }
  </style>

  <!-- Card: carries its own background so it reads on GitHub's light and dark themes -->
  <rect x="1" y="1" width="998" height="238" rx="16" fill="#101826" stroke="#30363d" stroke-width="2"/>

  <!-- Name block -->
  <text class="sans" x="48" y="104" font-size="46" font-weight="700" fill="#f0f6fc">Abdullah Bilal</text>
  <text class="sans" x="50" y="142" font-size="19" fill="#9da7b3">AI engineer · Islamabad</text>
  <text class="mono" x="50" y="178" fill="#6e7681">voice agents / screen agents / document pipelines</text>

  <!-- Row 1: voice agent -->
  <g transform="translate(540 52)">
    <rect class="pill" x="0" y="0" width="100" height="32" rx="16" stroke="#2dd4bf"/>
    <text class="mono label" x="50" y="21">call</text>
    <path class="arrow" d="M112 16h36m-7-6 7 6-7 6"/>
    <rect class="pill" x="160" y="0" width="100" height="32" rx="16" stroke="#2dd4bf"/>
    <text class="mono label" x="210" y="21">LLM</text>
    <path class="arrow" d="M272 16h36m-7-6 7 6-7 6"/>
    <rect x="320" y="0" width="120" height="32" rx="16" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5"/>
    <text class="mono label" x="380" y="21">warm transfer</text>
  </g>

  <!-- Row 2: screen agent -->
  <g transform="translate(540 104)">
    <rect class="pill" x="0" y="0" width="100" height="32" rx="16" stroke="#a78bfa"/>
    <text class="mono label" x="50" y="21">screen</text>
    <path class="arrow" d="M112 16h36m-7-6 7 6-7 6"/>
    <rect class="pill" x="160" y="0" width="100" height="32" rx="16" stroke="#a78bfa"/>
    <text class="mono label" x="210" y="21">VLM</text>
    <path class="arrow" d="M272 16h36m-7-6 7 6-7 6"/>
    <rect x="320" y="0" width="120" height="32" rx="16" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-width="1.5"/>
    <text class="mono label" x="380" y="21">click</text>
  </g>

  <!-- Row 3: document pipeline -->
  <g transform="translate(540 156)">
    <rect class="pill" x="0" y="0" width="100" height="32" rx="16" stroke="#fbbf24"/>
    <text class="mono label" x="50" y="21">photo</text>
    <path class="arrow" d="M112 16h36m-7-6 7 6-7 6"/>
    <rect class="pill" x="160" y="0" width="100" height="32" rx="16" stroke="#fbbf24"/>
    <text class="mono label" x="210" y="21">OCR</text>
    <path class="arrow" d="M272 16h36m-7-6 7 6-7 6"/>
    <rect x="320" y="0" width="120" height="32" rx="16" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.5"/>
    <text class="mono label" x="380" y="21">invoice</text>
  </g>
</svg>
