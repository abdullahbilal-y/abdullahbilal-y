name: GitHub-Profile-Summary-Cards

on:
  schedule: # once a day
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # The action's docs recommend a personal access token stored as the
          # SUMMARY_GITHUB_TOKEN repo secret. Falls back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          # Pakistan Standard Time
          UTC_OFFSET: 5
          AUTO_PUSH: true
          # Only the theme the README uses
          THEME: "tokyonight"
